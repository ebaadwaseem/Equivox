<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Long page</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  section { height: 100vh; display: flex; align-items: center; justify-content: center;
            font-size: 32px; border-bottom: 1px solid #ccc; }
  section:nth-child(odd) { background: #eef; }
  section:nth-child(even) { background: #efe; }
</style>
</head>
<body>
<section id="s1">Section 1 (top)</section>
<section id="s2">Section 2</section>
<section id="s3">Section 3</section>
<section id="s4">Section 4</section>
<section id="s5">Section 5 (bottom)</section>
</body>
</html>
