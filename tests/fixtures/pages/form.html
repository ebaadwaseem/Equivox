<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book an Appointment</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  nav { display: flex; gap: 16px; padding: 12px 20px; background: #222; }
  nav a { color: white; text-decoration: none; }
  form { max-width: 480px; margin: 40px auto; padding: 0 20px; }
  label { display: block; margin-top: 14px; font-weight: bold; }
  input[type=text], input[type=email], input[type=tel] { width: 100%; padding: 6px; }
  .hidden { display: none; }
  .invisible { visibility: hidden; }
  .zero { width: 0; height: 0; padding: 0; border: 0; overflow: hidden; }
  .covered-wrap { position: relative; }
  .cover { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 5; }
  .danger { background: #c0392b; color: white; margin-top: 30px; }
</style>
</head>
<body>
<nav>
  <a href="https://example.com/">Home</a>
  <a href="https://example.com/clinics">Clinics</a>
  <a href="https://example.com/about">About</a>
</nav>

<form id="appt-form">
  <h1>Book Appointment</h1>

  <label for="name">Full name</label>
  <input type="text" id="name" name="name" placeholder="Jane Doe">

  <label for="email">Email</label>
  <input type="email" id="email" name="email" placeholder="jane@example.com">

  <label for="phone">Phone</label>
  <input type="tel" id="phone" name="phone" placeholder="555-0100">

  <label for="date">Preferred date</label>
  <select id="date" name="date">
    <option value="">Choose a date</option>
    <option value="mon">Monday</option>
    <option value="tue">Tuesday</option>
    <option value="wed">Wednesday</option>
  </select>

  <label>Preferred time</label>
  <div>
    <input type="radio" id="time-morning" name="time" value="morning">
    <label for="time-morning" style="display:inline">Morning</label>
  </div>
  <div>
    <input type="radio" id="time-afternoon" name="time" value="afternoon">
    <label for="time-afternoon" style="display:inline">Afternoon</label>
  </div>

  <div>
    <input type="checkbox" id="agree" name="agree">
    <label for="agree" style="display:inline">I agree to the terms</label>
  </div>

  <!-- duplicate wrapped interactive element: anchor wrapping a button -->
  <a href="#" class="wrap-dup"><button type="button">Need help?</button></a>

  <!-- distractors that must be filtered out by observer.js -->
  <button class="hidden">Hidden button</button>
  <button class="invisible">Invisible button</button>
  <button class="zero">Zero size button</button>
  <button disabled>Disabled button</button>
  <div class="covered-wrap">
    <button>Covered button</button>
    <div class="cover"></div>
  </div>

  <button type="submit" id="submit-btn">Book Appointment</button>
  <button type="button" class="danger" id="delete-account">Delete account</button>
</form>
</body>
</html>
